<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spill — Demo</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
  #gl { image-rendering: pixelated; }
  #hud { pointer-events: none; }
  body { cursor: default; user-select: none; -webkit-user-select: none; }
  #ks { position: fixed; right: 20px; bottom: 20px; z-index: 20; width: 222px; padding: 10px 10px 8px; background: rgba(7, 6, 11, 0.88);
        border: 1px solid #3a2f26; color: #c9b597; font: 13px/1.4 Georgia, serif; text-align: center; transition: opacity .4s; }
  #ks.gone { opacity: 0; pointer-events: none; }
  #ks .lbl { letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: #c9a55a; margin: 0 0 8px; }
  #ks iframe { display: block; width: 220px; height: 392px; border: 0; margin: 0 auto; background: #07060b; }
  #ks a { color: #c9a55a; }
  #ks .x { position: absolute; top: 4px; right: 8px; color: #6e6152; cursor: pointer; font-size: 14px; }
  @media (max-height: 640px) { #ks iframe { display: none; } }
  #small a { color: #c9a55a; }
  #small { display: none; }
  @media (max-width: 700px), (pointer: coarse) and (hover: none) { #small { display: grid; place-items: center; position: fixed; inset: 0; z-index: 30; background: #07060b;
           color: #c9b597; padding: 24px; text-align: center; font: 16px/1.6 Georgia, serif; } }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="small"><div>Spill needs a desktop browser with a mouse and keyboard.<br><br><a href="https://www.kickstarter.com/projects/spill-game/spill-a-new-metroidvania" target="_blank" rel="noopener">Spill is on Kickstarter</a></div></div>
  <div id="ks">
    <span class="x" title="Hide" onclick="this.parentNode.classList.add('gone')">&times;</span>
    <p class="lbl">Live on Kickstarter</p>
    <iframe src="https://www.kickstarter.com/projects/spill-game/spill-a-new-metroidvania/widget/card.html?v=2" title="Spill on Kickstarter" loading="lazy" scrolling="no"></iframe>
    <a href="https://www.kickstarter.com/projects/spill-game/spill-a-new-metroidvania" target="_blank" rel="noopener">Back the full game</a>
  </div>
  <script src="src/fonts.js"></script>
